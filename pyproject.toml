[project]
name = "homestyle-rag"
version = "0.1.0"
description = "LG Homestyle content ingestion and grounded QA"
requires-python = ">=3.12"
dependencies = [
    "agent-framework>=1.2.0",
    "aiohttp>=3.11.18",
    "azure-ai-evaluation>=1.16.7",
    "azure-identity>=1.25.1",
    "azure-monitor-opentelemetry>=1.6.5",
    "azure-search-documents>=11.6.0",
    "beautifulsoup4>=4.13.4",
    "crawl4ai>=0.8.0",
    "lxml>=5.4.0",
    "openai>=1.79.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
    "playwright>=1.58.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest-playwright>=0.7.2",
    "ruff>=0.11.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=75"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = ["src"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "agent_framework.*",
    "azure.*",
    "bs4.*",
    "crawl4ai.*",
    "lxml.*",
    "openai.*",
    "playwright.*",
    "structlog.*",
]
ignore_missing_imports = true
