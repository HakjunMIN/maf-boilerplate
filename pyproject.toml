[project]
name = "homestyle-rag"
version = "0.1.0"
description = "LG Homestyle content ingestion and grounded QA"
requires-python = ">=3.12"
dependencies = [
    "agent-framework>=1.2.0",
    "aiohttp>=3.11.18",
    "azure-identity>=1.25.1",
    "azure-search-documents>=11.6.0",
    "beautifulsoup4>=4.13.4",
    "lxml>=5.4.0",
    "openai>=1.79.0",
    "playwright>=1.58.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-playwright>=0.7.2",
    "ruff>=0.11.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
